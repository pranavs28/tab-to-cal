<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="manifest.open_in_tab" content="true" />
    <title>Tab to Cal — Options</title>
    <style>
      body { max-width: 480px; margin: 24px auto; font: 14px/1.5 system-ui, sans-serif; color: #1a1a1a; padding: 0 16px; }
      h1 { font-size: 18px; }
      label { display: block; margin: 16px 0 4px; font-weight: 600; }
      .hint { font-weight: normal; color: #666; font-size: 12px; display: block; margin-top: 2px; }
      input[type=text], input[type=password], textarea { width: 100%; box-sizing: border-box; padding: 6px 8px; font: inherit; border: 1px solid #ccc; border-radius: 4px; }
      textarea { height: 60px; font-family: monospace; font-size: 12px; }
      .notice { background: #fff8e1; border: 1px solid #f0d060; border-radius: 6px; padding: 10px 12px; margin: 16px 0; font-size: 12px; }
      .notice label { display: flex; gap: 8px; align-items: start; font-weight: normal; margin: 6px 0 0; }
      button { margin-top: 20px; font: inherit; background: #1a73e8; color: #fff; border: none; border-radius: 4px; padding: 8px 14px; cursor: pointer; }
      #status { margin-left: 10px; color: #2e7d32; font-size: 12px; }
      a { color: #1a73e8; }
    </style>
  </head>
  <body>
    <h1>Tab to Cal</h1>

    <label for="apiKey">OpenRouter API key
      <span class="hint">Get one at <a href="https://openrouter.ai/keys" target="_blank">openrouter.ai/keys</a>. Stored only in this browser.</span>
    </label>
    <input type="password" id="apiKey" autocomplete="off" />

    <label for="model">Model
      <span class="hint">An OpenRouter model id that supports structured outputs, e.g. a <code>:free</code> model.</span>
    </label>
    <input type="text" id="model" autocomplete="off" />

    <label for="fallbackModels">Fallback models
      <span class="hint">One per line. Used in order if the model above is unavailable or over its rate limit.</span>
    </label>
    <textarea id="fallbackModels"></textarea>

    <label for="accountEmail">Google account (optional)
      <span class="hint">If you use more than one Google account, events open in this one. Leave blank for your browser's default account.</span>
    </label>
    <input type="text" id="accountEmail" placeholder="you@gmail.com" autocomplete="off" />

    <div class="notice">
      <strong>Before you start:</strong> free OpenRouter models are served by third-party providers that may log or
      retain what you send them. Don't use this on pages with information you wouldn't want a model provider to see.
      <label><input type="checkbox" id="ack" /> I understand.</label>
    </div>

    <button id="save">Save</button>
    <span id="status"></span>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
