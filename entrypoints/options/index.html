<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="manifest.open_in_tab" content="true" />
    <title>Tab to Cal — Options</title>
    <style>
      body { max-width: 480px; margin: 24px auto; font: 14px/1.5 system-ui, sans-serif; color: #1a1a1a; padding: 0 16px; }
      h1 { font-size: 18px; }
      label { display: block; margin: 16px 0 4px; font-weight: 600; }
      .hint { font-weight: normal; color: #666; font-size: 12px; display: block; margin-top: 2px; }
      input[type=text], input[type=password], textarea, select { width: 100%; box-sizing: border-box; padding: 6px 8px; font: inherit; border: 1px solid #ccc; border-radius: 4px; }
      textarea { height: 52px; font-family: monospace; font-size: 12px; }
      fieldset { border: 1px solid #ddd; border-radius: 8px; margin: 16px 0 0; padding: 4px 12px 12px; }
      fieldset legend { font-weight: 600; padding: 0 4px; }
      .notice { background: #fff8e1; border: 1px solid #f0d060; border-radius: 6px; padding: 10px 12px; margin: 16px 0; font-size: 12px; }
      .notice label { display: flex; gap: 8px; align-items: start; font-weight: normal; margin: 6px 0 0; }
      button { margin-top: 20px; font: inherit; background: #1a73e8; color: #fff; border: none; border-radius: 4px; padding: 8px 14px; cursor: pointer; }
      #status { margin-left: 10px; color: #2e7d32; font-size: 12px; }
      a { color: #1a73e8; }
    </style>
  </head>
  <body>
    <h1>Tab to Cal</h1>

    <label for="provider">LLM provider</label>
    <select id="provider">
      <option value="openrouter">OpenRouter</option>
      <option value="openai">OpenAI</option>
      <option value="anthropic">Claude (Anthropic)</option>
      <option value="gemini">Gemini (Google)</option>
    </select>

    <div id="providerSections"><!-- filled in by main.ts, one fieldset per provider --></div>

    <label for="accountEmail">Google account (optional)
      <span class="hint">If you use more than one Google account, events open in this one. Leave blank for your browser's default account.</span>
    </label>
    <input type="text" id="accountEmail" placeholder="you@gmail.com" autocomplete="off" />

    <div class="notice">
      <strong>Before you start:</strong> the page text you extract from is sent to whichever provider you pick above,
      using your own API key and account. Check that provider's data-usage policy if you're unsure how it handles
      input (some free-tier models may log or retain requests).
      <label><input type="checkbox" id="ack" /> I understand.</label>
    </div>

    <button id="save">Save</button>
    <span id="status"></span>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
