<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Add events from this tab to Google Calendar</title>
    <style>
      body { width: 320px; font: 13px/1.4 system-ui, sans-serif; margin: 0; padding: 10px 12px; color: #1a1a1a; }
      h1 { font-size: 13px; margin: 0 0 8px; font-weight: 600; }
      .muted { color: #666; }
      .row { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid #eee; }
      .row:last-child { border-bottom: none; }
      .row .when { flex: 1; min-width: 0; }
      .title { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .meta { color: #666; font-size: 11px; }
      .warn { color: #b06a00; }
      button { font: inherit; cursor: pointer; }
      .primary { background: #1a73e8; color: #fff; border: none; border-radius: 4px; padding: 6px 10px; }
      .link { background: none; border: 1px solid #ccc; border-radius: 4px; padding: 3px 8px; }
      .error { color: #c0392b; }
      .footer { margin-top: 10px; display: flex; justify-content: space-between; align-items: center; }
      .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid #ccc; border-top-color: #1a73e8; border-radius: 50%; animation: spin 0.7s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="app">Loading…</div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
